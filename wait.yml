---
# Espera as VMs criadas pelo Terraform aceitarem conexao SSH.
# Necessario porque o cloud-init ainda esta finalizando o primeiro boot
# quando o dominio aparece como criado.
- name: Aguardar SSH das VMs criadas pelo Terraform
  hosts: vm_qemu
  gather_facts: false

  tasks:
    - name: Esperar conexao SSH responder
      ansible.builtin.wait_for_connection:
        timeout: 600
        delay: 5

    - name: Coletar fatos basicos
      ansible.builtin.setup:
