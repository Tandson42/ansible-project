---
services:
  apache:
    image: ghcr.io/tandson42/ansible-project/apache:latest
    build:
      context: ./app
      dockerfile: ../Dockerfile
    restart: unless-stopped
    container_name: meu-apache-compose
    environment:
      DB_HOST: "10.0.2.2"
      DB_PORT: "3304"
      DB_NAME: "banco_do_tand"
      DB_USER: "tand"
      DB_PASSWORD: "123"
      WEB_NODE_NAME: "local-compose"
    ports:
      - "8080:80"
