[load_balancer]
lb ansible_host=127.0.0.1 ansible_port=2220 ansible_user=ubuntu

[vms]
vm1 ansible_host=127.0.0.1 ansible_port=2221 ansible_user=ubuntu
vm2 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu
vm3 ansible_host=127.0.0.1 ansible_port=2223 ansible_user=ubuntu

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
ansible_become_method=sudo
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
