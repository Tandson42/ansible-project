name: Test Ansible

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Ansible tools
        # ansible-lint fica fixado porque o --fix define a formatacao padrao:
        # versoes diferentes podem reformatar arquivos de forma diferente.
        run: python -m pip install ansible-core==2.21.4 ansible-lint==26.10.1

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.docker

      - name: Check playbook syntax
        run: ansible-playbook site.yml --syntax-check

      - name: Lint playbooks and roles
        run: ansible-lint site.yml roles/

      # Garante que os arquivos ja estao na formatacao padrao do Ansible.
      # Roda o auto-fix e falha se ele precisar alterar algo.
      - name: Check standard formatting
        run: |
          ansible-lint --fix site.yml roles/
          if ! git diff --exit-code; then
            echo "::error::Arquivos fora da formatacao padrao do Ansible. Rode 'make format' localmente e commite as alteracoes."
            exit 1
          fi