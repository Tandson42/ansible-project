name: CD (KVM + Ansible)

# Este workflow precisa de um runner SELF-HOSTED com KVM/libvirt
# (os runners hospedados pelo GitHub nao tem /dev/kvm e nao conseguem criar VMs).
#
# Cadastre o runner com as labels: self-hosted, linux, kvm
#   https://docs.github.com/actions/hosting-your-own-runners

on:
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        type: choice
        options: [deploy, plan, destroy]
        default: deploy
  push:
    branches: [main]
    paths:
      - "terraform/kvm/**"
      - "roles/**"
      - "site.yml"
      - "wait.yml"
      - "inventory/group_vars/**"

permissions:
  contents: read

jobs:
  cd:
    runs-on: [self-hosted, linux, kvm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar dependencias
        run: |
          for bin in terraform ansible-playbook virsh qemu-img; do
            command -v "$bin" >/dev/null || { echo "Faltando: $bin"; exit 1; }
          done
          terraform version
          ansible --version | head -1

      - name: Garantir colecao community.docker
        run: ansible-galaxy collection install community.docker

      - name: Terraform init
        run: terraform -chdir=terraform/kvm init -upgrade

      - name: Terraform validate
        run: terraform -chdir=terraform/kvm validate

      # ---- PLAN ----------------------------------------------------------
      - name: Terraform plan (plan)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'plan' }}
        run: terraform -chdir=terraform/kvm plan

      # ---- DEPLOY (CD completo) -----------------------------------------
      - name: Terraform apply (deploy)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
        run: terraform -chdir=terraform/kvm apply -auto-approve

      - name: Aguardar SSH (deploy)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
        run: ansible-playbook wait.yml -i inventory/generated.ini

      - name: Provisionar com Ansible (deploy)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
        run: ansible-playbook site.yml -i inventory/generated.ini

      # ---- DESTROY -------------------------------------------------------
      - name: Terraform destroy (destroy)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}
        run: terraform -chdir=terraform/kvm destroy -auto-approve
